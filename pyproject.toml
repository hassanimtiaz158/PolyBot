[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-quant-bot"
version = "0.1.0"
description = "Risk-first, fail-closed quantitative trading platform for Polymarket prediction markets"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.25",
    "websockets>=12.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "streamlit>=1.25",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
]
