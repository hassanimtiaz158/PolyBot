version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    command: ["uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    command: ["python", "-m", "app.main"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DASHBOARD_API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - sqlite_data:/app/data
    command: ["streamlit", "run", "app/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  sqlite_data:
